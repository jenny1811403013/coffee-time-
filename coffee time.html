<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Explorer | 全台咖啡廳探索指南</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            espresso: {
              50: '#fdfbf7',
              100: '#f7f2ea',
              200: '#eddcc8',
              300: '#dfbe9f',
              400: '#ce9c72',
              500: '#b87d4b',
              600: '#9e623b',
              700: '#804c32',
              800: '#693f2d',
              900: '#563528',
              950: '#301b14',
            },
            cream: {
              50: '#fefcf9',
              100: '#fcf8f2',
              200: '#f8efdf',
              300: '#f2dfc2',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #fdfbf7;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f7f2ea;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #ce9c72;
      border-radius: 9999px;
    }
    .glass-nav {
      background: rgba(253, 251, 247, 0.85);
      backdrop-filter: blur(12px);
    }
    #map-container {
      height: 520px;
      width: 100%;
      border-radius: 1.5rem;
      z-index: 1;
    }
  </style>
</head>
<body class="text-espresso-950 min-h-screen flex flex-col justify-between selection:bg-espresso-300 selection:text-espresso-950">

  <!-- 頂部導覽列 Header -->
  <header class="sticky top-0 z-40 glass-nav border-b border-espresso-100 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('explore')">
        <div class="w-10 h-10 rounded-full bg-espresso-700 text-cream-50 flex items-center justify-center shadow-md">
          <i class="fa-solid font-bold fa-mug-hot text-xl"></i>
        </div>
        <div>
          <span class="text-xl font-bold tracking-tight text-espresso-900 block leading-tight">Café Explorer</span>
          <span class="text-xs text-espresso-500 font-medium">尋找城市的下一處安身之所</span>
        </div>
      </div>

      <nav class="flex items-center space-x-2">
        <button id="nav-explore-btn" onclick="switchTab('explore')" class="px-5 py-2 rounded-xl font-medium text-sm transition-all flex items-center gap-2 bg-espresso-700 text-white shadow-sm">
          <i class="fa-solid fa-compass"></i>
          <span>探索店家</span>
        </button>
        <button id="nav-fav-btn" onclick="switchTab('favorites')" class="px-5 py-2 rounded-xl font-medium text-sm transition-all flex items-center gap-2 text-espresso-700 hover:bg-espresso-200/50 relative">
          <i class="fa-solid fa-heart text-rose-500"></i>
          <span>我的收藏</span>
          <span id="fav-badge" class="hidden ml-1 px-1.5 py-0.5 text-[10px] font-bold bg-rose-500 text-white rounded-full leading-none">0</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8 flex-grow w-full">

    <!-- 探索主視圖 -->
    <section id="explore-view" class="space-y-8">
      
      <!-- Hero Banner -->
      <div class="relative bg-gradient-to-r from-espresso-900 via-espresso-800 to-espresso-950 rounded-3xl p-8 sm:p-12 text-white overflow-hidden shadow-xl">
        <div class="absolute -right-10 -bottom-10 opacity-10 text-cream-50 text-9xl pointer-events-none">
          <i class="fa-solid fa-mug-hot"></i>
        </div>
        <div class="max-w-2xl space-y-4 relative z-10">
          <span class="px-3 py-1 bg-amber-500/20 text-amber-300 border border-amber-400/30 rounded-full text-xs font-semibold tracking-wider uppercase inline-block">
            <i class="fa-solid fa-bolt mr-1"></i> 全台 22 縣市 • 完整連鎖與獨立品牌
          </span>
          <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight leading-tight">
            Coffee Time
          </h1>
          <p class="text-espresso-200 text-sm sm:text-base leading-relaxed">
            結合星巴克、路易莎、cama、客美多及質感在地獨立老宅，一鍵探索您最愛的風格角落。
          </p>
        </div>
      </div>

      <!-- 近期熱門推薦區塊 (Top Recommended) -->
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h2 class="text-xl font-bold text-espresso-950 flex items-center gap-2">
            <i class="fa-solid fa-fire text-amber-500"></i>
            <span id="featured-title">近期熱門精選推薦</span>
          </h2>
          <span class="text-xs text-espresso-500 font-medium">依選擇之縣市即時聯動</span>
        </div>
        <div id="featured-cards-container" class="grid grid-cols-1 md:grid-cols-3 gap-5">
          <!-- 動態渲染 -->
        </div>
      </div>

      <!-- 篩選面板 -->
      <div class="bg-white rounded-3xl p-6 border border-espresso-200/80 shadow-sm space-y-5">
        <div class="flex flex-col sm:flex-row gap-4 items-center justify-between">
          <div class="relative w-full sm:w-96">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-espresso-400"></i>
            <input type="text" id="search-input" oninput="applyFilters()" placeholder="搜尋店名、關鍵字..." 
                   class="w-full pl-11 pr-4 py-3 rounded-2xl border border-espresso-200 focus:outline-none focus:ring-2 focus:ring-espresso-500/50 bg-cream-50/50 text-sm">
          </div>

          <div class="flex items-center gap-2 w-full sm:w-auto">
            <select id="city-select" onchange="onCityChange()" class="bg-cream-50 border border-espresso-200 text-espresso-900 rounded-xl px-3 py-2 text-xs sm:text-sm font-medium focus:outline-none w-1/2 sm:w-auto">
              <option value="all">全台灣 (所有縣市)</option>
            </select>
            <select id="district-select" onchange="applyFilters()" class="bg-cream-50 border border-espresso-200 text-espresso-900 rounded-xl px-3 py-2 text-xs sm:text-sm font-medium focus:outline-none w-1/2 sm:w-auto">
              <option value="all">全區域 (鄉鎮市區)</option>
            </select>
          </div>

          <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
            <button onclick="resetFilters()" class="text-sm text-espresso-600 hover:text-espresso-900 font-medium flex items-center gap-1.5 px-3 py-2 rounded-xl hover:bg-espresso-100 transition-colors">
              <i class="fa-solid fa-rotate-left"></i>
              <span>重設</span>
            </button>
          </div>
        </div>

        <!-- 類型與風格篩選 -->
        <div class="space-y-4 pt-4 border-t border-espresso-100">
          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
            <span class="text-xs font-bold text-espresso-500 w-20 flex-shrink-0"><i class="fa-solid fa-building-user mr-1"></i>店家類型</span>
            <div class="flex flex-wrap gap-2" id="chain-filter-group">
              <button onclick="toggleFilter('chain', 'all')" data-val="all" class="filter-btn-chain px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-800 bg-espresso-800 text-white transition-all">全部 (連鎖與獨立)</button>
              <button onclick="toggleFilter('chain', 'independent')" data-val="independent" class="filter-btn-chain px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">獨立咖啡廳</button>
              <button onclick="toggleFilter('chain', 'chain')" data-val="chain" class="filter-btn-chain px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">連鎖咖啡廳</button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
            <span class="text-xs font-bold text-espresso-500 w-20 flex-shrink-0"><i class="fa-solid fa-store mr-1"></i>環境風格</span>
            <div class="flex flex-wrap gap-2" id="env-filter-group">
              <button onclick="toggleFilter('env', 'all')" data-val="all" class="filter-btn-env px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-800 bg-espresso-800 text-white transition-all">全部風格</button>
              <button onclick="toggleFilter('env', '安靜舒適')" data-val="安靜舒適" class="filter-btn-env px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">安靜舒適</button>
              <button onclick="toggleFilter('env', '老宅復古')" data-val="老宅復古" class="filter-btn-env px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">老宅復古</button>
              <button onclick="toggleFilter('env', '極簡現代')" data-val="極簡現代" class="filter-btn-env px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">極簡現代</button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
            <span class="text-xs font-bold text-espresso-500 w-20 flex-shrink-0"><i class="fa-solid fa-plug mr-1"></i>插座需求</span>
            <div class="flex flex-wrap gap-2" id="socket-filter-group">
              <button onclick="toggleFilter('socket', 'all')" data-val="all" class="filter-btn-socket px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-800 bg-espresso-800 text-white transition-all">不限</button>
              <button onclick="toggleFilter('socket', '充足插座')" data-val="充足插座" class="filter-btn-socket px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">充足插座</button>
            </div>
          </div>

          <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-4">
            <span class="text-xs font-bold text-espresso-500 w-20 flex-shrink-0"><i class="fa-solid fa-coins mr-1"></i>價格區間</span>
            <div class="flex flex-wrap gap-2" id="price-filter-group">
              <button onclick="toggleFilter('price', 'all')" data-val="all" class="filter-btn-price px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-800 bg-espresso-800 text-white transition-all">全部</button>
              <button onclick="toggleFilter('price', '100-200')" data-val="100-200" class="filter-btn-price px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">100-200</button>
              <button onclick="toggleFilter('price', '200-300')" data-val="200-300" class="filter-btn-price px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">200-300</button>
              <button onclick="toggleFilter('price', '300-500')" data-val="300-500" class="filter-btn-price px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">300-500</button>
              <button onclick="toggleFilter('price', '500以上')" data-val="500以上" class="filter-btn-price px-3.5 py-1.5 rounded-full text-xs font-medium border border-espresso-200 bg-cream-50 text-espresso-700 hover:border-espresso-400 transition-all">500以上</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 列表與排序 (已移除地圖切換按鈕) -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-sm text-espresso-600 px-1">
        <div class="flex items-center gap-3">
          <div>找到 <span id="cafe-count" class="font-bold text-espresso-900 text-base">0</span> 間特色咖啡廳</div>
        </div>

        <div class="flex items-center gap-2">
          <select id="sort-select" onchange="applyFilters()" class="bg-white border border-espresso-200 text-espresso-800 rounded-xl px-3 py-1.5 text-xs font-medium focus:outline-none">
            <option value="rating-desc">評價最高</option>
            <option value="reviews-desc">評論最多</option>
          </select>
        </div>
      </div>

      <!-- 卡片列表 -->
      <div id="cafe-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <!-- 無結果提示 -->
      <div id="empty-results" class="hidden py-16 text-center space-y-4 bg-white rounded-3xl border border-dashed border-espresso-200">
        <div class="w-16 h-16 bg-espresso-100 rounded-full flex items-center justify-center mx-auto text-espresso-500 text-2xl">
          <i class="fa-solid fa-mug-saucer"></i>
        </div>
        <h3 class="text-lg font-bold text-espresso-900">找不到符合條件的咖啡廳</h3>
        <button onclick="resetFilters()" class="px-5 py-2.5 bg-espresso-700 hover:bg-espresso-800 text-white rounded-xl text-sm font-medium">重設篩選</button>
      </div>
    </section>

    <!-- 收藏分頁 -->
    <section id="favorites-view" class="hidden space-y-6">
      <div class="bg-cream-100/60 rounded-3xl p-6 sm:p-8 border border-espresso-200 flex items-center justify-between">
        <div>
          <h2 class="text-2xl font-bold text-espresso-900 flex items-center gap-2">
            <i class="fa-solid fa-heart text-rose-500"></i> 我的收藏口袋名單
          </h2>
        </div>
        <button onclick="clearAllFavorites()" id="clear-all-fav-btn" class="text-xs text-rose-600 bg-white border border-rose-200 px-4 py-2 rounded-xl font-medium">清空收藏</button>
      </div>
      <div id="fav-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <div id="fav-empty" class="hidden py-16 text-center space-y-4 bg-white rounded-3xl border border-dashed border-espresso-200">
        <h3 class="text-lg font-bold text-espresso-900">目前尚無收藏的咖啡廳</h3>
      </div>
    </section>

  </main>

  <!-- 詳細資訊與菜單彈窗 Modal -->
  <div id="modal-backdrop" onclick="closeModal(event)" class="fixed inset-0 bg-espresso-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="modal-card" class="bg-white w-full max-w-2xl rounded-3xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300 max-h-[90vh] flex flex-col">
      
      <div class="relative h-60 w-full bg-espresso-200 flex-shrink-0">
        <img id="modal-img" src="" alt="" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
        <button onclick="closeModalDirect()" class="absolute top-4 right-4 w-9 h-9 bg-black/40 text-white rounded-full flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="absolute bottom-4 left-6 right-6 text-white space-y-1">
          <div class="flex items-center gap-2 flex-wrap" id="modal-badges"></div>
          <h2 id="modal-title" class="text-2xl font-bold"></h2>
          <p id="modal-address" class="text-xs text-espresso-200 flex items-center gap-1.5"></p>
        </div>
      </div>

      <div class="p-6 space-y-6 overflow-y-auto custom-scrollbar flex-grow text-espresso-900">
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-cream-50 p-4 rounded-2xl border text-center">
          <div>
            <div class="text-xs text-espresso-500">綜合評分</div>
            <div class="text-lg font-bold text-amber-500 mt-0.5"><span id="modal-rating">--</span></div>
          </div>
          <div>
            <div class="text-xs text-espresso-500">消費低消</div>
            <div id="modal-min-spend" class="text-sm font-bold text-espresso-800 mt-1">--</div>
          </div>
          <div>
            <div class="text-xs text-espresso-500">時間限制</div>
            <div id="modal-time-limit" class="text-sm font-bold text-espresso-800 mt-1">--</div>
          </div>
          <div>
            <div class="text-xs text-espresso-500">插座配備</div>
            <div id="modal-sockets" class="text-sm font-bold text-espresso-800 mt-1">--</div>
          </div>
        </div>

        <div class="space-y-2">
          <h3 class="text-sm font-bold text-espresso-900 uppercase">店家特色簡介</h3>
          <p id="modal-desc" class="text-sm text-espresso-700 leading-relaxed"></p>
        </div>

        <!-- 完整菜單與價格表 -->
        <div class="space-y-3">
          <h3 class="text-sm font-bold text-espresso-900 uppercase flex items-center gap-2">
            <i class="fa-solid fa-book-open text-espresso-600"></i> 店內詳細菜單與價格表
          </h3>
          <div id="modal-full-menu" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
        </div>

        <div class="pt-4 border-t border-espresso-100 flex items-center justify-between">
          <a id="modal-map-btn" href="#" target="_blank" rel="noopener noreferrer" 
             class="px-5 py-2.5 bg-espresso-800 text-white rounded-xl text-sm font-medium flex items-center gap-2">
            <i class="fa-solid fa-location-dot"></i> Google 地圖導航
          </a>
          <button id="modal-fav-toggle" class="px-5 py-2.5 bg-rose-50 text-rose-700 border border-rose-200 rounded-xl text-sm font-medium">加入收藏</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-6 right-6 bg-espresso-900 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-3 opacity-0 translate-y-4 pointer-events-none transition-all duration-300 z-50">
    <i class="fa-solid fa-circle-check text-emerald-400"></i>
    <span id="toast-msg" class="text-sm font-medium">訊息</span>
  </div>

  <!-- JavaScript 核心邏輯 -->
  <script>
    // 1. 台灣完整 22 縣市與所有鄉鎮市區對照表

    function renderFeaturedRecommendations() {
      const container = document.getElementById('featured-cards-container');

      if (!container) return;

      const currentCity = filters.city;
      let pool = currentCity === 'all'

        : cafesData.filter(c => c.city === currentCity).sort((a, b) => b.rating - a.rating).slice(0, 3);

      if (pool.length === 0) {
        container.innerHTML = `<div class="col-span-3 text-center py-6 text-sm text-espresso-500 bg-white rounded-2xl border">無推薦資料</div>`;

      container.innerHTML = pool.map((cafe, index) => `

    function applyFilters() {
      filters.search = document.getElementById('search-input').value.trim().toLowerCase();
      filters.city = document.getElementById('city-select').value;
      filters.district = document.getElementById('district-select').value;
      filters.sort = document.getElementById('sort-select').value;

      ensureCityData(filters.city);

      let result = cafesData.filter(cafe => {
        const matchSearch = !filters.search || 
          cafe.name.toLowerCase().includes(filters.search) ||
          cafe.address.toLowerCase().includes(filters.search);

        const matchCity = filters.city === 'all' || cafe.city === filters.city;
        const matchDistrict = filters.district === 'all' || cafe.district === filters.district;
        
        const isChain = cafe.tags.includes('連鎖品牌');
        const matchChain = filters.chain === 'all' || 
                           (filters.chain === 'chain' && isChain) || 
                           (filters.chain === 'independent' && !isChain);

        const matchEnv = filters.env === 'all' || cafe.envStyle === filters.env;
        const matchSocket = filters.socket === 'all' || cafe.socketType === filters.socket;
        const matchPrice = filters.price === 'all' || cafe.priceRange === filters.price;

        return matchSearch && matchCity && matchDistrict && matchChain && matchEnv && matchSocket && matchPrice;
      });

      result.sort((a, b) => {
        if (filters.sort === 'rating-desc') return b.rating - a.rating;
        if (filters.sort === 'reviews-desc') return b.reviewsCount - a.reviewsCount;
        return 0;
      });

      renderCafeGrid(result);
      renderFeaturedRecommendations();
    }

        <div class="bg-white rounded-3xl overflow-hidden border border-espresso-200/70 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group hover:-translate-y-1">
          <div class="relative h-52 overflow-hidden bg-espresso-100">
            <img src="${cafe.image}" alt="${cafe.name}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-80"></div>
            <div class="absolute top-3 left-3 flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-espresso-900/90 text-white">${cafe.city} • ${cafe.district}</span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-bold bg-black/50 text-white">${cafe.priceRange}</span>
            </div>
            <div class="absolute bottom-3 left-3 flex items-center space-x-1 text-amber-400 text-xs font-bold">
              <i class="fa-solid fa-star"></i>
              <span class="text-white text-sm font-extrabold">${cafe.rating}</span>
            </div>
          </div>
          <div class="p-5 flex-grow flex flex-col justify-between space-y-4">
            <div class="space-y-2.5">
              <h3 class="text-lg font-bold text-espresso-950">${cafe.name}</h3>
              <p class="text-xs text-espresso-500 font-medium">${cafe.subtitle}</p>
            </div>
            <div class="pt-3 border-t border-espresso-100 flex items-center justify-between">
              <span class="text-xs text-espresso-500 truncate max-w-[185px]"><i class="fa-solid fa-location-dot"></i> ${cafe.address}</span>
              <button onclick="openModal('${cafe.id}')" class="font-bold text-xs text-espresso-700 hover:underline">詳細資訊 →</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderFavorites() {
      const grid = document.getElementById('fav-grid');
      const empty = document.getElementById('fav-empty');
      const list = cafesData.filter(c => favorites.includes(c.id));
      if (list.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }
      empty.classList.add('hidden');
      grid.innerHTML = list.map(cafe => `
        <div class="bg-white rounded-3xl overflow-hidden border p-4 shadow-sm flex flex-col justify-between">
          <h3 class="font-bold">${cafe.name}</h3>
          <button onclick="openModal('${cafe.id}')" class="mt-2 py-1 bg-espresso-800 text-white text-xs rounded-xl">查看詳情</button>
        </div>
      `).join('');
    }

    function clearAllFavorites() {
      favorites = [];
      localStorage.setItem('cafe_favorites', JSON.stringify(favorites));
      updateFavBadge();
      renderFavorites();
    }

    function updateFavBadge() {
      const badge = document.getElementById('fav-badge');
      if (!badge) return;
      if (favorites.length > 0) {
        badge.textContent = favorites.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    function toggleFavorite(e, id) {
      if (e) e.stopPropagation();
      const idx = favorites.indexOf(id);
      if (idx > -1) favorites.splice(idx, 1);
      else favorites.push(id);
      localStorage.setItem('cafe_favorites', JSON.stringify(favorites));
      updateFavBadge();
      applyFilters();
    }

    function openModal(id) {
      const cafe = cafesData.find(c => c.id === id);
      if (!cafe) return;
      document.getElementById('modal-img').src = cafe.image;
      document.getElementById('modal-title').textContent = cafe.name;
      document.getElementById('modal-address').innerHTML = `<i class="fa-solid fa-location-dot"></i> ${cafe.address}`;
      document.getElementById('modal-rating').textContent = `${cafe.rating} (${cafe.reviewsCount})`;
      document.getElementById('modal-min-spend').textContent = cafe.minSpend;
      document.getElementById('modal-time-limit').textContent = cafe.timeLimit;
      document.getElementById('modal-sockets').textContent = cafe.sockets;
      document.getElementById('modal-desc').textContent = cafe.desc;

      const fullMenuEl = document.getElementById('modal-full-menu');
      fullMenuEl.innerHTML = [
        { name: "莊園美式咖啡", price: 100 },
        { name: "手沖單品咖啡", price: 160 },
        { name: "經典拿鐵", price: 130 },
        { name: "招牌焦糖肉桂捲", price: 120 },
        { name: "法式提拉米蘇", price: 140 }
      ].map(m => `
        <div class="flex justify-between p-2.5 rounded-xl bg-cream-50 border text-xs">
          <span class="font-bold">${m.name}</span>
          <span class="font-mono text-amber-800 font-bold">NT$ ${m.price}</span>
        </div>
      `).join('');

      document.getElementById('modal-map-btn').href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cafe.name + ' ' + cafe.address)}`;
      
      const favToggle = document.getElementById('modal-fav-toggle');
      const isFav = favorites.includes(id);
      favToggle.textContent = isFav ? "已收藏" : "加入收藏";
      favToggle.onclick = (e) => toggleFavorite(e, id);

      const backdrop = document.getElementById('modal-backdrop');
      backdrop.classList.remove('pointer-events-none', 'opacity-0');
      document.body.style.overflow = 'hidden';
    }

    function closeModal(e) { if (e.target.id === 'modal-backdrop') closeModalDirect(); }
    function closeModalDirect() {
      document.getElementById('modal-backdrop').classList.add('opacity-0', 'pointer-events-none');
      document.body.style.overflow = 'auto';
    }

    document.addEventListener('DOMContentLoaded', () => {
      ensureCityData('all');
      initCitySelect();
      updateFavBadge();
      applyFilters();
    });
  </script>
</body>
</html>
